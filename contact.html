<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
        }

        input,
        textarea {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input:focus,
        textarea:focus {
            outline: 2px solid #555;
        }

        textarea {
            min-height: 120px;
        }

        button {
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <h1>Contact Me</h1>

    <form action="https://oim.zhili.dev/echo/view" method="GET">

        <label for="name">Name:</label>
        <input 
            type="text" 
            id="name" 
            name="name" 
            required
        >

        <label for="email">Email:</label>
        <input 
            type="email" 
            id="email" 
            name="email" 
            required
        >

        <label for="message">Message:</label>
        <textarea 
            id="message" 
            name="message" 
            required
        ></textarea>

        <button type="submit">Submit</button>

    </form>

</body>
</html>

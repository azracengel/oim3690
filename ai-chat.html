<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask AI</title>
</head>
<body>
  <h1>Ask AI</h1>
  <textarea id="prompt" placeholder="Ask AI anything..."></textarea>
  <button id="askBtn">Ask</button>
  <p id="answer"></p>

  <script>
    // This page works only on your vercel.app link. Live Server and GitHub Pages
    // cannot run the function in api/ask.js, so there the Ask button fails.

    // Sends your prompt to your own function at /api/ask. The function adds the
    // key and calls the model, so no key appears anywhere on this page.
    async function askAI(prompt) {
      const response = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });
      let data;
      try {
        data = await response.json();
      } catch {
        throw new Error(`Request failed: ${response.status}`);
      }
      if (!response.ok) {
        throw new Error(data.error || `Request failed: ${response.status}`);
      }
      // Ignore reasoning items and read the generated text from the message.
      const message = Array.isArray(data.output)
        ? data.output.find(item => item.type === 'message')
        : null;
      const text = message?.content?.find(part => typeof part.text === 'string')?.text;
      if (!text) {
        throw new Error('The AI response did not contain answer text.');
      }
      return text;
    }

    const askBtn = document.querySelector('#askBtn');
    askBtn.addEventListener('click', async () => {
      const prompt = document.querySelector('#prompt').value;
      const answerEl = document.querySelector('#answer');
      if (!prompt.trim()) {
        answerEl.textContent = 'Please enter a question.';
        return;
      }
      // Turn the button off until the answer arrives, so a second click
      // cannot send, and pay for, a second request.
      askBtn.disabled = true;
      // A call takes a few seconds, so show something while you wait.
      answerEl.textContent = 'Thinking...';
      try {
        // textContent shows the answer as plain text. innerHTML would run any
        // HTML the model wrote.
        answerEl.textContent = await askAI(prompt);
      } catch (error) {
        answerEl.textContent = 'Error: ' + error.message;
      } finally {
        // finally runs whether the call worked or failed.
        askBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
